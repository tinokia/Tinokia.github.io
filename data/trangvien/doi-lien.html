<body>

<header>

<div class="logo">

</div>

</ul>

</header>

<main>

<h2>

Danh sách Đôi Liễn

<span id="tongLien"></span>

</h2>

<div class="search-box">

<input
type="text"
id="search"
placeholder="🔍 Tìm kiếm đôi liễn..."
onkeyup="timKiem()">

</div>

<div id="danhsach"></div>

<div id="phantrang" class="pagination"></div>

</main>

<footer>

© 2026 Thơ - Danh Ngôn - Đôi Liễn

</footer>

<script src="lien.js"></script>

<script src="script.js"></script>

<script>

const ds=document.getElementById("danhsach");

const soBaiMoiTrang=10;

let trangHienTai=1;

let duLieu=[...lien];

function hienThiLien(){

let batDau=(trangHienTai-1)*soBaiMoiTrang;

let ketThuc=batDau+soBaiMoiTrang;

let dsHien=duLieu.slice(batDau,ketThuc);

let html="";

if(dsHien.length===0){

html=`
<div class="item">

<h3>Không tìm thấy đôi liễn.</h3>

</div>
`;

}else{

dsHien.forEach(function(item){

html+=`

<div class="item">

<h3>${item.tieude}</h3>

<p><b>Vế trái:</b> ${item.vietTrai}</p>

<p><b>Vế phải:</b> ${item.vietPhai}</p>

<button
class="button"
onclick="docBai('lien',${item.id})">

🏮 Xem đôi liễn

</button>

</div>

`;

});

}

ds.innerHTML=html;

taoPhanTrang();

}

function taoPhanTrang(){

let tongTrang=Math.ceil(duLieu.length/soBaiMoiTrang);

let html="";

if(tongTrang<=1){

document.getElementById("phantrang").innerHTML="";

return;

}

html+=`
<button
class="page"
onclick="doiTrang(${trangHienTai-1})"
${trangHienTai==1?"disabled":""}>
◀
</button>
`;

for(let i=1;i<=tongTrang;i++){

html+=`

<button
class="page ${i==trangHienTai?"active":""}"
onclick="doiTrang(${i})">

${i}

</button>

`;

}

html+=`
<button
class="page"
onclick="doiTrang(${trangHienTai+1})"
${trangHienTai==tongTrang?"disabled":""}>
▶
</button>
`;

document.getElementById("phantrang").innerHTML=html;

}

function doiTrang(trang){

let tongTrang=Math.ceil(duLieu.length/soBaiMoiTrang);

if(trang<1||trang>tongTrang){

return;

}

trangHienTai=trang;

hienThiLien();

}

function timKiem(){

const tuKhoa=document
.getElementById("search")
.value
.toLowerCase()
.trim();

duLieu=lien.filter(function(item){

return(

item.tieude.toLowerCase().includes(tuKhoa)

||

(item.vietTrai||"").toLowerCase().includes(tuKhoa)

||

(item.vietPhai||"").toLowerCase().includes(tuKhoa)

||

(item.hanTrai||"").includes(tuKhoa)

||

(item.hanPhai||"").includes(tuKhoa)

||

(item.ynghia||"").toLowerCase().includes(tuKhoa)

);

});

trangHienTai=1;

hienThiLien();

}

hienThiLien();

document.getElementById("tongLien").innerHTML=
" ("+lien.length+" đôi liễn)";

</script>
<script src="clock.js"></script>
</body>
</html>
